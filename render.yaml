services:
  - type: web
    name: ts-technology-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py setup_roles && python manage.py create_demo_users
    startCommand: cd backend && gunicorn ts_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "ts-technology-backend.onrender.com,*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ts-technology-45.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ts-technology-45.vercel.app"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "tssoftwaretechnology@gmail.com"
      - key: DEFAULT_FROM_EMAIL
        value: "tssoftwaretechnology@gmail.com"
      - key: CONTACT_NOTIFICATION_EMAIL
        value: "tssoftwaretechnology@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
