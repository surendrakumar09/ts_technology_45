services:
  - type: web
    name: ts-technology-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py setup_roles && python manage.py create_demo_users
    startCommand: cd backend && gunicorn ts_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "ts-technology-backend.onrender.com,*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ts-technology-45.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ts-technology-45.vercel.app"
