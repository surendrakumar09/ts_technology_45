version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ts_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ts_technology_db
      MYSQL_USER: ts_user
      MYSQL_PASSWORD: ts_secure_password_2026
      MYSQL_ROOT_PASSWORD: ts_root_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: ts_django_backend
    restart: always
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn ts_backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-ts-technology-production-key-2026-secure-default
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=ts_technology_db
      - DB_USER=ts_user
      - DB_PASSWORD=ts_secure_password_2026
      - DB_HOST=db
      - DB_PORT=3306
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    depends_on:
      - db

volumes:
  mysql_data:
  media_data:
  static_data:
